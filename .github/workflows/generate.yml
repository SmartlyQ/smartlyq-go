name: Regenerate

on:
  # Fired by the docs repository when openapi.json changes
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Bump and release even if the spec is unchanged'
        type: boolean
        default: false
  schedule:
    # Daily safety net in case a dispatch is missed
    - cron: '30 4 * * *'

concurrency:
  group: regenerate-sdk
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate from OpenAPI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Fetch latest OpenAPI spec
        run: curl -f --retry 5 --retry-delay 2 -o openapi.json https://docs.smartlyq.com/openapi.json

      - name: Generate SDK
        run: go run ./scripts/generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if ! git diff --staged --quiet || [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version, commit, and tag
        if: steps.changes.outputs.has_changes == 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Go modules publish via git tags - compute the next patch version
          # from the latest v* tag (v0.1.0 if the repo has none yet).
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            NEW_VERSION=$(echo "$LATEST_TAG" | awk -F. '{ printf "%s.%s.%d", $1, $2, $3 + 1 }')
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate from OpenAPI spec

          Auto-generated SDK update ($NEW_VERSION)"
          fi

          # Retry with rebase to survive concurrent dispatches
          for attempt in 1 2 3; do
            if git push; then break; fi
            echo "Push attempt $attempt failed; rebasing and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 5))
          done

          git tag -a "$NEW_VERSION" -m "SmartlyQ Go SDK $NEW_VERSION"
          git push origin "$NEW_VERSION"

      # Go modules publish via tags - no registry token involved. The release
      # makes the new version visible on the repo page and in release feeds.
      - name: Create GitHub Release
        if: steps.changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          body: |
            ## Auto-generated SDK update

            This release was generated from the latest OpenAPI spec.

            ```bash
            go get github.com/SmartlyQ/smartlyq-go@${{ steps.version.outputs.new_version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
